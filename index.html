<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aplikace M - SILNICE OZ JIH</title>
<style>
  :root{--bg:#0f2036;--bg2:#1e3a5f;--card:#ffffff;--line:#e4e8ef;--txt:#1b2430;--muted:#6b7a90;--accent:#1e3a5f;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
       background:linear-gradient(165deg,#0f2036,#1e3a5f 60%,#274a75);min-height:100vh;color:#fff;-webkit-text-size-adjust:100%}
  .wrap{max-width:1000px;margin:0 auto;padding:48px 20px 60px}
  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
  h1{font-size:26px;margin:0;font-weight:800;letter-spacing:.3px}
  .sub{color:#a9bcd6;font-size:14px;margin:0 0 30px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
  a.tile{display:flex;flex-direction:column;gap:8px;background:var(--card);color:var(--txt);text-decoration:none;
    border-radius:16px;padding:20px 18px;box-shadow:0 6px 22px rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.06);
    transition:transform .12s ease,box-shadow .12s ease;position:relative;min-height:132px}
  a.tile:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,0,0,.28)}
  a.tile.soon{pointer-events:none;opacity:.6}
  .ico{font-size:26px;line-height:1}
  .tname{font-weight:800;font-size:16px}
  .tdesc{font-size:12.5px;color:var(--muted);line-height:1.45;flex:1}
  .stav{position:absolute;top:14px;right:14px;font-size:10px;font-weight:800;letter-spacing:.4px;
    padding:3px 8px;border-radius:999px;text-transform:uppercase}
  .stav.live{background:#dcfce7;color:#15803d}
  .stav.soon{background:#eef1f5;color:#6b7a90}
  .sec{font-size:13px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:#9fb4d4;margin:26px 0 12px;border-bottom:1px solid rgba(255,255,255,.12);padding-bottom:6px}
  .sec:first-child{margin-top:0}
  footer{margin-top:34px;color:#8ea4c2;font-size:12px}
  footer b{color:#c3d4ec}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Aplikace M - SILNICE OZ JIH</h1>
  </header>
  <p class="sub">Rozcestník aplikací přípravy. Klikni na dlaždici. Každá aplikace má vlastní přihlášení.</p>
  <div id="root"></div>
  <footer>Aplikace se plní automaticky z mailů (sběrná schránka v BCC).</footer>
</div>
<script>
/* Data se načítají z jednoho zdroje: stavby.json (stejný soubor používá i přepínač v appkách). */
function tile(a){
  var live=a.status==='live'&&a.url;
  return '<a class="tile '+(live?'':'soon')+'" href="'+(live?a.url:'#')+'"'+(live?' ':' aria-disabled="true"')+'>'+
    '<span class="stav '+(live?'live':'soon')+'">'+(live?'živé':'připravujeme')+'</span>'+
    '<span class="ico">'+a.ico+'</span>'+
    '<span class="tname">'+a.name+'</span>'+
    '<span class="tdesc">'+a.desc+'</span>'+
  '</a>';
}
function section(title,apps){return '<div class="sec">'+title+'</div><div class="grid">'+apps.map(tile).join('')+'</div>';}
fetch('stavby.json',{cache:'no-cache'})
  .then(function(r){return r.json();})
  .then(function(d){
    document.getElementById('root').innerHTML=
      section('Nástroje',d.nastroje||[])+
      section('Stavby — mapa, výkresy, fotky',d.stavby||[]);
  })
  .catch(function(){
    document.getElementById('root').innerHTML='<p style="color:#ffb4b4">Nepodařilo se načíst seznam aplikací (stavby.json).</p>';
  });
</script>
</body>
</html>
